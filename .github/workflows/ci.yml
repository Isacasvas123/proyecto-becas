name: CI

# Se ejecuta en cada Pull Request hacia develop o main, y en cada push a esas ramas.
# Si algo falla aquí, GitHub bloquea el merge (configurar en Settings > Branches).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  calidad:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: becas
          POSTGRES_PASSWORD: becas_test
          POSTGRES_DB: becas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://becas:becas_test@localhost:5432/becas_test
      JWT_SECRET: secreto-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (linter)
        run: npm run lint

      - name: Aplicar migraciones
        run: npm run db:migrate:deploy

      - name: Pruebas unitarias con cobertura
        run: npm run test:cov

      - name: Pruebas de integración
        run: npm run test:e2e

      - name: Compilar
        run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14
