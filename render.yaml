# Definición del entorno de Staging (Render Blueprint).
#
# POR QUÉ ESTE ARCHIVO EXISTE
#   El punto 8 de nuestra Definition of Done exige que la funcionalidad esté desplegada en
#   Staging antes de darla por terminada. Este archivo describe ese entorno como código, en
#   lugar de dejarlo configurado a mano en un panel web donde nadie más sabe qué se apretó.
#
# POR QUÉ RENDER Y NO OTRO
#   Tiene plan gratuito con PostgreSQL administrado, lee este archivo directamente del
#   repositorio y no pide tarjeta para el plan gratuito. Alternativas evaluadas: Fly.io (pide
#   tarjeta), Railway (el plan gratuito terminó), un VPS (más control, más trabajo de
#   administración del que este proyecto justifica).
#
# LIMITACIÓN CONOCIDA DEL PLAN GRATUITO
#   El servicio se suspende tras 15 minutos sin tráfico y el primer acceso después tarda
#   unos 50 segundos en responder. Para una demostración ante el Product Owner hay que
#   abrirlo unos minutos antes. No es un defecto del despliegue.
#
# CÓMO SE USA: ver docs/17-staging.md

databases:
  - name: becas-staging-db
    databaseName: becas
    user: becas
    plan: free

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: becas-api-staging
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: develop
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: becas-staging-db
          property: connectionString
      # Render genera un valor aleatorio y no queda escrito en ningún archivo del
      # repositorio. El secreto de desarrollo de .env.example NO se reutiliza.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRACION
        value: 8h
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: NODE_ENV
        value: production
      # Origen exacto del frontend de Staging, CON https://. El código ya lee esta variable
      # (apps/api/src/main.ts).
      #
      # POR QUÉ `sync: false` Y NO `fromService`
      #   La primera versión usaba `fromService … property: host`, y estaba mal: según la
      #   documentación de Render, `host` es "el hostname en la red PRIVADA", sin esquema. El
      #   navegador habría rechazado todas las peticiones por CORS y la aplicación no habría
      #   funcionado aunque el despliegue saliera en verde.
      #
      #   La URL pública no se conoce hasta crear el servicio (Render puede añadir un sufijo si
      #   el nombre está tomado), así que `sync: false` hace que Render la pida al crear el
      #   Blueprint. Valor esperado: https://becas-web-staging.onrender.com
      - key: CORS_ORIGEN
        sync: false

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: becas-web-staging
    runtime: static
    # Sin `plan`: Render rechaza ese campo en sitios estaticos ("no such plan free for
    # service type web"), porque siempre son gratuitos. Detectado al crear el Blueprint.
    branch: develop
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      # URL pública de la API, CON https://. Se incrusta en el JavaScript al compilar: si cambia,
      # hay que volver a desplegar el frontend. Mismo motivo que CORS_ORIGEN para `sync: false`,
      # y además `fromService` no aplica a sitios estáticos.
      # Valor esperado: https://becas-api-staging.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # La aplicación usa enrutador del lado del cliente: cualquier ruta desconocida debe
      # devolver el index.html para que el enrutador la resuelva, en vez de un 404 del
      # servidor estático. Sin esto, recargar la página en /convocatorias se rompe.
      - type: rewrite
        source: /*
        destination: /index.html
